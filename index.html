<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking Exam App</title>

<style>
body {
  margin: 0;
  padding: 24px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e8f5e9, #f1fff4);
  color: #1b1b1b;
}

h1 {
  text-align: center;
  font-size: 1.8rem;
  margin: 0;
}

.headerBox {
  background: white;
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  border: 2px solid #2e7d32;
}

.timer {
  text-align: center;
  font-size: 2.6rem;
  font-weight: bold;
  margin-top: 8px;
  color: #1b5e20;
}

.card {
  background: #ffffff;
  padding: 22px;
  border-radius: 22px;
  margin-bottom: 18px;
  font-size: 1.25rem;
  line-height: 1.7;
  border: 2px solid #c8e6c9;
  box-shadow: 0 8px 18px rgba(0,0,0,0.06);
}

.topic {
  display: inline-block;
  margin-top: 8px;
  padding: 6px 12px;
  border-radius: 14px;
  background: #dcedc8;
  font-weight: 700;
  color: #1b5e20;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

button {
  width: 100%;
  padding: 16px;
  font-size: 1.1rem;
  border-radius: 999px;
  border: none;
  background: #2e7d32;
  color: white;
  margin-top: 10px;
  margin-bottom: 18px;
  font-weight: 600;
  box-shadow: 0 6px 14px rgba(0,0,0,0.12);
}

button:hover { background: #256428; }
button:active { transform: scale(0.98); }

button.secondary {
  background: #9e9e9e;
}

.endScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.95);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font-size: 3rem;
  font-weight: bold;
  color: #1b5e20;
  z-index: 9999;
  animation: fadeInScreen 0.8s ease forwards;
  cursor: pointer;
}

@keyframes fadeInScreen {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="headerBox">
  <h1>
    <span style="font-size: 1.55rem; font-weight: 700; letter-spacing: 0.5px;">
      SPEAKING TEST&nbsp;&nbsp;&nbsp; <span style="color: gray;">PART 1</span>
    </span><br>
    <span style="font-size: 1.15rem; font-weight: 700;">
      General conversation
    </span>
  </h1>
  <div class="timer" id="timer">04:00</div>
</div>

<button onclick="startExam()">Start Exam</button>

<div class="card">
In this part, I’m going to give you a <strong>topic</strong> to talk about.<br><br>
Ask each other questions in order to find out about
<div id="t1" class="topic"></div><br>
Keep the conversation going.
</div>

<button onclick="showSecondTopic()">Show Second Topic</button>

<div class="card">
Here is another topic for you.<br><br>
Talk about
<div id="t2" class="topic"></div>
</div>

<button class="secondary" onclick="resetExam()">Next Test</button>

<div id="endScreen" class="endScreen" onclick="dismissEnd()">
  <div id="endMessage">Good Job! 👏</div>
</div>

<script>
const topics = [
"your dream job","your dream vacation","your hobbies and free time","social media",
"your plans for the future","role models","school life","something you are grateful for",
"your family and friends","a perfect weekend","special days","a healthy lifestyle",
"sports","your daily chores","your daily habits","food","famous people",
"films and series","places you have visited","a childhood memory"
];

const messages = [
"Good Job! 👏",
"Well done! 🌟",
"Excellent speaking! 💬",
"Brilliant work! 🚀",
"Amazing effort! 🎯",
"Keep it up! 💪"
];

let timer;
let timeLeft = 240;
let currentTopic1 = "";
let endTimeout;

function updateTimer() {
  let min = Math.floor(timeLeft / 60);
  let sec = timeLeft % 60;
  document.getElementById("timer").textContent =
    String(min).padStart(2,'0') + ":" + String(sec).padStart(2,'0');

  if (timeLeft <= 0) {
    clearInterval(timer);
    document.getElementById("timer").textContent = "TIME UP";
    showEndScreen();
  } else {
    timeLeft--;
  }
}

function startTimer() {
  clearInterval(timer);
  timeLeft = 240;
  timer = setInterval(updateTimer, 1000);
}

function generateTopic1() {
  currentTopic1 = topics[Math.floor(Math.random() * topics.length)];
  document.getElementById("t1").textContent = currentTopic1;
  document.getElementById("t2").textContent = "";
}

function showSecondTopic() {
  let filtered = topics.filter(t => t !== currentTopic1);
  let topic2 = filtered[Math.floor(Math.random() * filtered.length)];
  document.getElementById("t2").textContent = topic2;
}

function startExam() {
  generateTopic1();
  startTimer();
}

function resetExam() {
  clearInterval(timer);
  clearTimeout(endTimeout);
  timeLeft = 240;
  document.getElementById("timer").textContent = "04:00";
  document.getElementById("t1").textContent = "";
  document.getElementById("t2").textContent = "";
  currentTopic1 = "";
  document.getElementById("endScreen").style.display = "none";
}

function showEndScreen() {
  const screen = document.getElementById("endScreen");
  const msg = document.getElementById("endMessage");

  const randomIndex = Math.floor(Math.random() * messages.length);
  msg.textContent = messages[randomIndex];

  screen.style.display = "flex";

  endTimeout = setTimeout(() => {
    resetExam();
  }, 30000);
}

function dismissEnd() {
  resetExam();
}

updateTimer();
</script>

</body>
</html>
